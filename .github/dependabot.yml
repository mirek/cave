version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    assignees:
      - mirek
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Match the type surface to the oldest supported Node runtime. A newer
      # major can tighten declarations in ways that do not compile on Node 22.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # The VS Code type surface must not exceed `engines.vscode` in
      # editors/vscode/package.json, or `vsce package` refuses to build the
      # extension. Raise both together when a newer editor API is needed.
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # TypeScript 7 replaces the JavaScript compiler API that
      # scripts/packed-contract.mjs uses for the packed type check; moving to
      # it is a deliberate migration rather than a routine bump.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Changesets v3 renames `changeset tag`, stops versioning private
      # packages by default, and pairs with changesets/action v2; see
      # todo/changesets-v3-migration.md for the deliberate migration.
      - dependency-name: "@changesets/cli"
        update-types:
          - "version-update:semver-major"
    groups:
      routine-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          # Native/WASM runtimes, parsers, compilers, and release tools get
          # one PR each so their generated output and packaging stay legible.
          - "@changesets/*"
          - "@playwright/*"
          - "@prelude/parser"
          - "@vitejs/*"
          - "@vscode/vsce*"
          - "esbuild"
          - "sql.js"
          - "typescript"
          - "vite"
          - "web-tree-sitter"
          - "z3-solver"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    assignees:
      - mirek
    commit-message:
      prefix: "chore(actions)"
    ignore:
      # changesets/action v2 requires Changesets CLI v3 and renames every
      # input; it moves together with the CLI migration recorded in
      # todo/changesets-v3-migration.md.
      - dependency-name: "changesets/action"
        update-types:
          - "version-update:semver-major"
    groups:
      routine-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          # Checkout/runtime bootstrap, compiler setup, and publishing actions
          # remain independent supply-chain review units.
          - "actions/checkout"
          - "actions/configure-pages"
          - "actions/deploy-pages"
          - "actions/setup-node"
          - "actions/upload-pages-artifact"
          - "changesets/action"
          - "pnpm/action-setup"
          - "typst-community/setup-typst"
        update-types:
          - minor
          - patch
