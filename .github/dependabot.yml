version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    assignees:
      - mirek
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Keep the established Node type baseline until a major upgrade is reviewed
      # against the supported runtime APIs and the complete workspace build.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Keep the exact VS Code type pin aligned with the minimum editor API.
      # vsce checks the declared range, not the resolved declarations; a caret
      # can silently admit newer APIs. Raise the pin and engine together.
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # TypeScript 7 replaces the compiler API used by packed type/API and
      # runtime-dependency checks, and the release fixture compiler path.
      # See DEPENDENCY-MAINTENANCE.md for the deliberate migration gates.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      routine-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          # Native/WASM runtimes, parsers, compilers, and release tools get
          # one PR each so their generated output and packaging stay legible.
          - "@changesets/*"
          - "@playwright/*"
          - "@prelude/parser"
          - "@vitejs/*"
          - "@vscode/vsce*"
          - "esbuild"
          - "mdast-util-*"
          - "micromark*"
          - "sql.js"
          - "typescript"
          - "vite"
          - "web-tree-sitter"
          - "z3-solver"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    assignees:
      - mirek
    commit-message:
      prefix: "chore(actions)"
    groups:
      routine-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          # Checkout/runtime bootstrap, compiler setup, and publishing actions
          # remain independent supply-chain review units.
          - "actions/checkout"
          - "actions/configure-pages"
          - "actions/deploy-pages"
          - "actions/setup-node"
          - "actions/upload-pages-artifact"
          - "changesets/action"
          - "pnpm/action-setup"
          - "typst-community/setup-typst"
        update-types:
          - minor
          - patch
