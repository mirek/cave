name: Publish

# Changesets release automation. On every push to main:
#   - pending .changeset/*.md files → opens/updates the
#     `chore(release): version packages` PR (branch changeset-release/main),
#     which bumps every version source in lockstep;
#   - no pending changesets → runs scripts/release-publish.sh, which is a
#     no-op when the current version is already on npm, and otherwise
#     builds, tests, smoke-checks the packed artifacts, publishes all packages,
#     and tags v<version>.
#
# npm auth is OIDC trusted publishing (id-token: write) — no npm token;
# each @cavelang package has this repo + THIS WORKFLOW FILENAME
# (publish.yml) configured as a trusted publisher on npmjs.com, so don't
# rename this file. Provenance is automatic. First-time publishes of new
# packages still need `make publish` from a machine with npm auth, since
# trusted publishing can only be configured on packages that already exist
# on the registry. Do not use `npm publish` for that bootstrap: pnpm applies
# the production export/bin overrides stored in publishConfig.

on:
  push:
    branches:
      - main

permissions:
  contents: write # push the changeset-release branch and the v<version> tag
  pull-requests: write # open/update the version packages PR
  id-token: write # npm OIDC trusted publishing

concurrency:
  group: publish-main
  cancel-in-progress: false # never cancel a run that may be mid-publish

jobs:
  # Validate the route to a version PR, or the exact publish identity, before
  # npm registry setup grants the publish process an authentication path.
  preflight:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0

      - name: Validate version-PR or publish readiness
        id: mode
        run: |
          if git ls-files '.changeset/*.md' | grep -v '^\.changeset/README\.md$' | grep -q .; then
            node scripts/release-validate.mjs --mode=version-pr
            echo "mode=version-pr" >> "$GITHUB_OUTPUT"
          else
            node scripts/release-validate.mjs --mode=publish
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds

      - run: pnpm install --frozen-lockfile

      - name: Cache verified grammar archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/cave/grammar-toolchain/downloads
          key: grammar-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/grammar-toolchain.json') }}

      # Note: the version packages PR is opened with GITHUB_TOKEN, so its
      # branch push creates no `push` run (GitHub suppresses workflows for
      # events created by the default token). The PR itself still gets
      # `pull_request` runs, held in `action_required` until a maintainer
      # approves them (`gh api -X POST .../actions/runs/<id>/approve`);
      # the pull-requests skill's release-PR checklist does that before
      # merging. CI also runs on main after merge, and the publish path
      # below builds and tests before anything ships. If branch protection
      # ever requires those checks without manual approval, give this step
      # a PAT or GitHub App token instead.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release:publish
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          create-github-releases: false
          push-git-tags: false # release-publish.sh owns the single v<version> tag

  # Marketplace publication of the VS Code extension follows every npm
  # release automatically. The v<version> tag is pushed with GITHUB_TOKEN,
  # which never triggers tag workflows, so this runs as a chained job instead.
  # `--skip-duplicate` makes reruns and unchanged extensions a no-op; the
  # workflow_dispatch in vscode.yml remains for republishing an older tag.
  vscode:
    needs: [preflight, release]
    if: needs.preflight.outputs.mode == 'publish'
    environment: vscode-marketplace
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate tag and lockstep release identity
        run: node scripts/release-validate.mjs --mode=publish

      - name: Package and validate the VSIX
        run: pnpm --filter cave-language package

      - name: Publish the validated VSIX to Marketplace
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath cave-language-*.vsix --skip-duplicate
