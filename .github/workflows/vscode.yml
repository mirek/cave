name: Publish VS Code extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing CAVE release version to publish (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vscode-marketplace-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    environment: vscode-marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate tag and lockstep release identity
        env:
          CAVE_RELEASE_TAG: v${{ inputs.version }}
          CAVE_RELEASE_ROOT: ${{ github.workspace }}
        run: |
          # Old tags carry old validators; use this workflow commit's guard.
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "${GITHUB_SHA}:scripts/release-validate.mjs" > "$RUNNER_TEMP/cave-release-validate.mjs"
          node "$RUNNER_TEMP/cave-release-validate.mjs" --mode=publish

      - name: Package and validate the VSIX
        run: pnpm --filter cave-language package

      - name: Publish the validated VSIX to Marketplace
        working-directory: editors/vscode
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath "cave-language-${RELEASE_VERSION}.vsix" --skip-duplicate
