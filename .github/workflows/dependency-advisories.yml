name: Dependency advisories

on:
  schedule:
    - cron: '17 5 * * 1-5'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/dependabot.yml'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: dependency-advisories-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit production and development dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=low

      - name: Report advisory ownership
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error title=Dependency advisory::Owner @mirek: triage the pnpm audit findings using DEPENDENCY-MAINTENANCE.md."
          {
            echo '## Dependency advisory'
            echo ''
            echo 'Owner: @mirek'
            echo ''
            echo 'Triage and escalation policy: DEPENDENCY-MAINTENANCE.md.'
            echo 'Scope: production dependencies and development tooling, including packaging and publishing tools.'
            echo 'Review the audit output above, then patch, defer with a tracked deadline, or document a time-bounded ignore.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
